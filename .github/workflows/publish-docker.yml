name: Publish Docker images

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: publish-docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            image: altstack-server
            dockerfile: apps/server/Dockerfile
            build_args: ''
          - name: web
            image: altstack-web
            dockerfile: apps/web/Dockerfile
            build_args: |
              VITE_APP_NAME=${{ vars.VITE_APP_NAME }}
              VITE_APP_URL=${{ vars.VITE_APP_URL }}
              VITE_DASHBOARD_URL=${{ vars.VITE_DASHBOARD_URL }}
              VITE_SERVER_URL=${{ vars.VITE_SERVER_URL }}
          - name: dashboard
            image: altstack-dashboard
            dockerfile: apps/dashboard/Dockerfile
            build_args: |
              VITE_APP_NAME=${{ vars.VITE_APP_NAME }}
              VITE_APP_URL=${{ vars.VITE_APP_URL }}
              VITE_DASHBOARD_URL=${{ vars.VITE_DASHBOARD_URL }}
              VITE_SERVER_URL=${{ vars.VITE_SERVER_URL }}

    steps:
      - name: Validate publish configuration
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          VITE_APP_NAME: ${{ vars.VITE_APP_NAME }}
          VITE_APP_URL: ${{ vars.VITE_APP_URL }}
          VITE_DASHBOARD_URL: ${{ vars.VITE_DASHBOARD_URL }}
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
        run: |
          test -n "$DOCKERHUB_USERNAME"
          if [ "${{ matrix.name }}" != "server" ]; then
            test -n "$VITE_APP_NAME"
            test -n "$VITE_APP_URL"
            test -n "$VITE_DASHBOARD_URL"
            test -n "$VITE_SERVER_URL"
          fi

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
